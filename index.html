<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="./styles.css">

  <title>Expense Tracker</title>
</head>

<body>
  <h1>Expense Tracker</h1>
  <section id="expense-data">
    <div class="text-center m-5">
      <span>Your Total Expenses are: £</span>
      <span class="mx-auto text-center" id="expense-total">0</span>
    </div>
  </section>
  <section id="add-expense" display="hidden">
    <button class="btn-solid theme-primary mx-auto add-expense-btn" type="button" data-bs-toggle="collapse" data-bs-target="#collapseExample" aria-expanded="false" aria-controls="collapseExample">
      Add an Expense...
    </button>
    <div class="container collapse" id="collapseExample">
      <form action="" id="create-expense">
        <div class="input-group input-group-lg input-field mx-auto m-3">
          <span class="input-group-text">Expense</span>
          <input type="text" id="listed-expense" class="form-control" required>

        </div>
        <div class="input-group input-group-lg input-field mx-auto m-3">
          <span class="input-group-text">Amount </span>
          <input id="cost-of-expense" type="number" min="0.01" step="0.01" class="form-control" required>
        </div>
        <div class="form-field input-field mx-auto m-3">
          <select name="" id="type-of-expense" class="form-control" required>
            <option value="" class="type-menu">-- Choose Type of Expense --</option>
            <option value="Housing" class="type-menu">Housing</option>
            <option value="Bills" class="type-menu">Bills</option>
            <option value="Car & Transport" class="type-menu">Car & Transport</option>
            <option value="Food & Groceries" class="type-menu">Food & Groceries</option>
            <option value="Eating Out" class="type-menu">Eating Out</option>
            <option value="Shopping" class="type-menu">Shopping</option>
            <option value="Entertainment" class="type-menu">Entertainment</option>
            <option value="Subscriptions" class="type-menu">Subscriptions</option>
            <option value="Health & Fitness" class="type-menu">Health & Fitness</option>
            <option value="Holidays & Travel" class="type-menu">Holidays & Travel</option>
            <option value="Other" class="type-menu">Other</option>
          </select>
        </div>
        <div class="container">
          <button type="submit" class="theme-primary btn-solid btn-styled rounded-pill add-expense-btn mx-auto">Add Expense</button>
        </div>
      </form>
    </div>
  </section>
  <h2 class="m-6">All Expenses</h2>
  <div class="row expense-titles align-items-center mx-auto ">
    <span class="col text-center">Name</span>
    <span class="col text-center">Type</span>
    <span class="col-1 text-center">£</span>
    <span class="col-1 text-center m-5">Edit</span>
    <span class="col-1 text-center m-5">Del</span>
  </div>
  <section id="expense-view" class="mx-auto">

  </section>

  <script src="./script.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</body>

</html>
